# applicationSets.yaml
releases:
  globals:
    # if we use the chart repo we need to be conected to remote
    chartRepoUrl: https://github.com/markoskandylis/eks-fleet-management
    chartRepoRevision: main
    # If we use ECR and use_helm_repo_path is false
    chartRepo: "1234567890.dkr.ecr.eu-west-2.amazonaws.com/fleet-management"
    ecrChartName: "application-sets"
    version: 0.0.1
  addons:
    - releaseName: "default"
      use_helm_repo_path: "true"
    - releaseName: "release1"
      use_helm_repo_path: "true"
  monitoring:
    - releaseName: "default"
      use_helm_repo_path: "true"
  resources:
    - releaseName: "default"
      use_helm_repo_path: "true"
  fleet:
    - releaseName: "default"
      use_helm_repo_path: "true"
  test-group:
     - releaseName: "default"
       use_helm_repo_path: "true"
       version: 0.0.1
